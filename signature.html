<!doctype html><html lang="fr-CA"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow"/><title>Signature du contrat | Salle Point G</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/styles.css"/><link rel="stylesheet" href="/contract.css"/></head><body><header class="contract-header"><div class="wrap"><a class="brand" href="/"><img src="/assets/logo-salle-point-g.png" alt="Salle Point G"/><span>Salle<br/><b>Point G</b></span></a></div></header><main class="contract-wrap"><section id="loading" class="contract-card"><h1>Chargement du contrat…</h1></section><section id="signing" class="hidden"><div class="contract-card"><p class="kicker dark">Document confidentiel</p><h1>Votre contrat.</h1><div id="contract-summary" class="signature-summary"></div><p>Le document contractuel complet est présenté ci-dessous. Prenez-en connaissance avant de signer.</p><iframe class="contract-document" src="/assets/contrat-location-template.pdf#toolbar=1" title="Conditions complètes du contrat"></iframe></div><form id="signature-form" class="contract-card"><h2>Signature électronique</h2><p id="signer-intro"></p><label>Nom complet du signataire *<input name="name" required autocomplete="name"/></label><label class="signature-label">Dessinez votre signature dans le cadre *</label><canvas id="signature-pad" width="800" height="240" aria-label="Zone de signature"></canvas><button id="clear-signature" class="text-button" type="button">Effacer la signature</button><label class="check acceptance"><input name="consent" type="checkbox" required/> Je confirme mon identité, avoir lu le contrat et vouloir le signer électroniquement. Je comprends que la date, l’heure, mon adresse IP et l’empreinte du document seront consignées dans le dossier de preuve.</label><button class="button" type="submit">Signer le contrat</button><p class="form-message" role="status"></p></form></section></main><script src="/js/signature.js" defer></script></body></html>
